<!DOCTYPE html>
<!-- DOCTYPE: le dice al navegador que esta pagina es HTML5. Siempre va en la primera linea -->
<!-- html: encierra TODA la pagina. lang="es": el texto esta en espanol -->
<html lang="es">
<!-- head: datos de la pagina que NO se ven (titulo, estilos, fuentes, scripts) -->
<head>
    <!-- meta charset="UTF-8": permite tildes y enes -->
    <meta charset="UTF-8">
    <!-- meta viewport: en el celular, la pagina usa el ancho real de la pantalla, sin zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title: el texto de la pestana del navegador -->
    <title>Catálogo · ElectroVerde</title>
    <!-- icon: el iconito de la pestana (un rayo). Va dentro del enlace, asi no hace falta otro archivo -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
    <!-- Bootstrap: hoja de estilos ya hecha, desde internet (CDN). Va PRIMERO -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Google Fonts: la fuente Poppins. preconnect abre la conexion antes, para que cargue mas rapido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- crossorigin: el archivo de la fuente viene de otro sitio (gstatic.com); asi lo permite -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- La hoja de la fuente: grosor normal (400) y negrilla (700) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <!-- Hoja de estilos PROPIA (estilo EXTERNO): css/estilos.css, la MISMA en las 4 paginas.
         Va DESPUES de Bootstrap: si las dos dicen algo distinto, gana la que se carga de ultimas -->
    <link rel="stylesheet" href="css/estilos.css">
    <!-- script: carga el programa JavaScript js/tienda.js.
         defer: lo ejecuta cuando la pagina ya termino de cargar
         (si no, JavaScript buscaria #productos antes de que exista) -->
    <script src="js/tienda.js" defer></script>
<!-- Cierra el head -->
</head>
<!-- body: todo lo que se ve. container centra el contenido; py-3 deja espacio arriba y abajo -->
<body class="container py-3">
    <!-- header: el encabezado, igual en las 4 paginas (clase propia "encabezado") -->
    <header class="encabezado">
        <!-- div class="marca": el logo y el nombre, en fila (Flexbox) -->
        <div class="marca">
            <!-- svg: el LOGO dibujado con codigo (un circulo y un rayo). Sus colores estan en estilos.css -->
            <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="Logo de ElectroVerde">
                <circle class="logo-fondo" cx="24" cy="24" r="22"></circle>
                <path class="logo-rayo" d="M27 6 14 27h8l-3 15 15-22h-9z"></path>
            </svg>
            <!-- h1: el titulo principal (solo uno por pagina) -->
            <h1>ElectroVerde · Catálogo</h1>
        </div>
        <!-- p: un parrafo que explica la pagina -->
        <p>Cada producto dice cuánto le ahorra al mes, con una tarifa de 950 COP/kWh.</p>
        <!-- nav: el menu, con un enlace (a) a cada pagina. href: la pagina a la que lleva -->
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html" aria-current="page">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <!-- main: el contenido principal -->
    <main>
        <!-- div class="buscador": la caja del buscador. JavaScript escucha el evento "input" del campo -->
        <div class="buscador">
            <!-- label: la etiqueta del campo. for lo enlaza con id="buscador".
                 visually-hidden (Bootstrap): no se ve, pero los lectores de pantalla la leen -->
            <label for="buscador" class="visually-hidden">Buscar productos</label>
            <!-- input type="search": un campo de busqueda. form-control: estilo de Bootstrap -->
            <input type="search" id="buscador" class="form-control" placeholder="Buscar por nombre o categoría (ej: LED, solar)">
        </div>

        <!-- div class="filtros": la caja con los botones para filtrar por categoria (Flexbox).
             data-categoria: un dato PROPIO guardado en el boton; JavaScript lo lee con
             boton.dataset.categoria. "filtro activo": el boton elegido al empezar (Todas) -->
        <div class="filtros">
            <button class="filtro activo" data-categoria="todas">Todas</button>
            <button class="filtro" data-categoria="iluminacion">Iluminación</button>
            <button class="filtro" data-categoria="electrodomesticos">Electrodomésticos</button>
            <button class="filtro" data-categoria="solar">Energía solar</button>
        </div>

        <!-- div class="catalogo": dos columnas (Grid): los productos a la izquierda y el carrito a la derecha.
             En tablet y celular el carrito pasa debajo -->
        <div class="catalogo">
            <!-- div id="productos": VACIO a proposito. JavaScript lo llena con las tarjetas
                 (y lo vuelve a llenar con cada filtro o cada letra del buscador) -->
            <div id="productos" class="tarjetas"></div>

            <!-- aside: contenido al lado del principal. Aqui, el CARRITO -->
            <aside id="carrito">
                <h2>Carrito</h2>
                <!-- ul: lista sin numeros. JavaScript le agrega un li por cada producto -->
                <ul id="lista-carrito"></ul>
                <!-- Dos parrafos vacios: JavaScript escribe aqui el total, el ahorro y los meses -->
                <p id="total"></p>
                <p id="ahorro"></p>
                <!-- Boton para vaciar el carrito. Clases de Bootstrap:
                     btn = boton; btn-outline-secondary = gris, solo con borde; btn-sm = pequeno -->
                <button id="vaciar" class="btn btn-outline-secondary btn-sm">Vaciar carrito</button>
            </aside>
        </div>
    </main>

    <!-- footer: el pie de pagina, con su clase propia "pie" -->
    <footer class="pie">
        <p>Los productos y sus precios son de ejemplo.</p>
        <p>ElectroVerde · Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
