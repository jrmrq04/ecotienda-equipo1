<!DOCTYPE html>
<!-- DOCTYPE: le dice al navegador que esta pagina es HTML5. Siempre va en la primera linea -->
<!-- html: encierra TODA la pagina. lang="es": el texto esta en espanol -->
<html lang="es">
<!-- head: datos de la pagina que NO se ven (titulo, estilos, fuentes, scripts) -->

<head>
    <meta name="theme-color" content="#1b5e20">
    <!-- meta charset="UTF-8": permite tildes y enes -->
    <meta charset="UTF-8">
    <!-- meta viewport: en el celular, la pagina usa el ancho real de la pantalla, sin zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title: el texto de la pestana del navegador -->
    <title>Contacto · ElectroVerde</title>
    <!-- icon: el iconito de la pestana (un rayo). Va dentro del enlace, asi no hace falta otro archivo -->
    <link rel="icon" href="favicon.ico">
    <!-- Bootstrap: hoja de estilos ya hecha, desde internet (CDN). Va PRIMERO -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Google Fonts: la fuente Poppins. preconnect abre la conexion antes, para que cargue mas rapido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- crossorigin: el archivo de la fuente viene de otro sitio (gstatic.com); asi lo permite -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- La hoja de la fuente: grosor normal (400) y negrilla (700) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <!-- Hoja de estilos PROPIA (estilo EXTERNO): css/estilos.css, la MISMA en las 4 paginas.
         Va DESPUES de Bootstrap: si las dos dicen algo distinto, gana la que se carga de ultimas -->
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/app.js"></script>
    <!-- Cierra el head -->
</head>

<body class="kMegaq_className">
    <div hidden=""></div>
    <div class="container py-3">
        <header class="encabezado">
            <div class="marca"><svg class="logo" viewBox="0 0 48 48" role="img" aria-label="Logo de ElectroVerde">
                    <circle class="logo-fondo" cx="24" cy="24" r="22"></circle>
                    <path class="logo-rayo" d="M27 6 14 27h8l-3 15 15-22h-9z"></path>
                </svg>
                <h1>ElectroVerde · Contacto</h1>
            </div>
            <p>Escríbanos: le respondemos sobre productos, precios y ahorro.</p>
            <nav class="menu">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Catálogo</a>
                <a href="admin.html">Administración</a>
                <a href="nosotros.html">Nosotros</a>
                <a aria-current="page" href="contacto.html">Contacto</a>
            </nav>
        </header>
        <main>
            <section id="intro">
                <h2>Envíenos un mensaje</h2>
                <form>
                    <div class="mb-3"><label for="nombre" class="form-label">Nombre completo</label><input type="text"
                            id="nombre" class="form-control" placeholder="Ej: María Pérez" required="" name="nombre" />
                    </div>
                    <div class="mb-3"><label for="correo" class="form-label">Correo electrónico</label><input
                            type="email" id="correo" class="form-control" placeholder="ejemplo@correo.com" required=""
                            name="correo" /></div>
                    <div class="mb-3"><label for="telefono" class="form-label">Teléfono celular</label><input type="tel"
                            id="telefono" class="form-control" placeholder="Ej. 3001234567" pattern="[0-9]{10}"
                            title="Escriba 10 dígitos, sin espacios" required="" name="telefono" /></div>
                    <div class="mb-3"><label for="interes" class="form-label">¿Qué le interesa?</label><select
                            id="interes" name="interes" class="form-select" required="">
                            <option value="" disabled="" selected="">Elija una categoría</option>
                            <option value="iluminacion">Iluminación</option>
                            <option value="electrodomesticos">Electrodomésticos</option>
                            <option value="solar">Energía solar</option>
                            <option value="otro">Otro</option>
                        </select></div>
                    <div class="mb-3"><label for="mensaje" class="form-label">Mensaje</label><textarea id="mensaje"
                            name="mensaje" class="form-control" rows="4" minLength="10"
                            placeholder="Cuéntenos en qué podemos ayudarle" required=""></textarea></div>
                    <div class="form-check mb-3"><input type="checkbox" id="acepto" class="form-check-input" required=""
                            name="acepto" /><label for="acepto" class="form-check-label">Acepto que ElectroVerde use mis
                            datos para responderme.</label></div><button type="submit"
                        class="btn btn-primary me-2">Enviar mensaje</button><button type="reset"
                        class="btn btn-outline-secondary">Borrar</button>
                </form>
            </section>
        </main>
        <footer class="pie">
            <p>Fuente de los precios: <a href="https://www.xm.com.co" target="_blank" rel="noopener noreferrer">XM</a>.
                Los productos y sus precios son de ejemplo.</p>
            <p>ElectroVerde · Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
        </footer>
    </div>
</body>

</html>
