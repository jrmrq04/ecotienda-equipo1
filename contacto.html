<!DOCTYPE html>
<!-- DOCTYPE: le dice al navegador que esta pagina es HTML5. Siempre va en la primera linea -->
<!-- html: encierra TODA la pagina. lang="es": el texto esta en espanol -->
<html lang="es">
<!-- head: datos de la pagina que NO se ven (titulo, estilos, fuentes, scripts) -->
<head>
    <!-- meta charset="UTF-8": permite tildes y enes -->
    <meta charset="UTF-8">
    <!-- meta viewport: en el celular, la pagina usa el ancho real de la pantalla, sin zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title: el texto de la pestana del navegador -->
    <title>Contacto · ElectroVerde</title>
    <!-- icon: el iconito de la pestana (un rayo). Va dentro del enlace, asi no hace falta otro archivo -->
    <link rel="icon" href="favicon.ico">
    <!-- Bootstrap: hoja de estilos ya hecha, desde internet (CDN). Va PRIMERO -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Google Fonts: la fuente Poppins. preconnect abre la conexion antes, para que cargue mas rapido -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- crossorigin: el archivo de la fuente viene de otro sitio (gstatic.com); asi lo permite -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- La hoja de la fuente: grosor normal (400) y negrilla (700) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
    <!-- Hoja de estilos PROPIA (estilo EXTERNO): css/estilos.css, la MISMA en las 4 paginas.
         Va DESPUES de Bootstrap: si las dos dicen algo distinto, gana la que se carga de ultimas -->
    <link rel="stylesheet" href="css/estilos.css">
<!-- Cierra el head -->
</head>
<!-- body: todo lo que se ve. container centra el contenido; py-3 deja espacio arriba y abajo -->
<body class="container py-3">
    <!-- header: el encabezado, igual en las 4 paginas (clase propia "encabezado") -->
    <header class="encabezado">
        <!-- div class="marca": el logo y el nombre, en fila (Flexbox) -->
        <div class="marca">
            <!-- svg: el LOGO dibujado con codigo (un circulo y un rayo). Sus colores estan en estilos.css -->
            <svg class="logo" viewBox="0 0 48 48" role="img" aria-label="Logo de ElectroVerde">
                <circle class="logo-fondo" cx="24" cy="24" r="22"></circle>
                <path class="logo-rayo" d="M27 6 14 27h8l-3 15 15-22h-9z"></path>
            </svg>
            <!-- h1: el titulo principal (solo uno por pagina) -->
            <h1>ElectroVerde · Contacto</h1>
        </div>
        <!-- p: un parrafo que explica la pagina -->
        <p>Escríbanos: le respondemos sobre productos, precios y ahorro.</p>
        <!-- nav: el menu, con un enlace (a) a cada pagina. href: la pagina a la que lleva -->
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html" aria-current="page">Contacto</a>
        </nav>
    </header>

    <main>
        <!-- section id="intro": la caja blanca con borde amarillo (estilo #intro) -->
        <section id="intro">
            <h2>Envíenos un mensaje</h2>
            <!-- form: el FORMULARIO. action: a donde se envian los datos (aqui "#": todavia no hay servidor).
                 method="post": los datos viajan ocultos, no en la direccion.
                 Los datos solo se envian si TODOS los campos required estan bien llenos -->
            <form action="#" method="post">

                <!-- CAMPO 1: nombre (texto).
                     label for="nombre": la etiqueta; "for" la enlaza con el campo que tiene id="nombre"
                     (al hacer clic en el texto, el cursor entra al campo).
                     input type="text": una linea de texto. name: el nombre del dato al enviarlo.
                     required: obligatorio. placeholder: el texto gris de ayuda -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" class="form-control"
                           placeholder="Ej: María Pérez" required>
                </div>

                <!-- CAMPO 2: correo. type="email": el navegador revisa que tenga @ y dominio -->
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-control"
                           placeholder="ejemplo@correo.com" required>
                </div>

                <!-- CAMPO 3: telefono. type="tel": en el celular abre el teclado numerico.
                     pattern: solo acepta 10 digitos (celular colombiano). title: el mensaje si no cumple -->
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono celular</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control"
                           placeholder="Ej. 3001234567" pattern="[0-9]{10}"
                           title="Escriba 10 dígitos, sin espacios" required>
                </div>

                <!-- CAMPO 4: categoria de interes. select: una lista desplegable.
                     option value: lo que se envia; el texto de adentro es lo que se ve.
                     El primer option esta vacio (value=""): obliga a elegir uno -->
                <div class="mb-3">
                    <label for="interes" class="form-label">¿Qué le interesa?</label>
                    <select id="interes" name="interes" class="form-select" required>
                        <option value="" selected disabled>Elija una categoría</option>
                        <option value="iluminacion">Iluminación</option>
                        <option value="electrodomesticos">Electrodomésticos</option>
                        <option value="solar">Energía solar</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>

                <!-- CAMPO 5: mensaje. textarea: texto de VARIAS lineas (rows = lineas visibles).
                     minlength: minimo de letras para que no lo manden vacio -->
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" class="form-control" rows="4"
                              minlength="10" placeholder="Cuéntenos en qué podemos ayudarle" required></textarea>
                </div>

                <!-- CAMPO 6: aceptar el tratamiento de datos. type="checkbox": una casilla para marcar.
                     required: sin marcarla, no se envia -->
                <div class="form-check mb-3">
                    <input type="checkbox" id="acepto" name="acepto" class="form-check-input" required>
                    <label for="acepto" class="form-check-label">
                        Acepto que ElectroVerde use mis datos para responderme.
                    </label>
                </div>

                <!-- button type="submit": ENVIA el formulario (btn btn-primary: boton verde, personalizado en estilos.css).
                     type="reset": lo deja en blanco otra vez -->
                <button type="submit" class="btn btn-primary">Enviar mensaje</button>
                <button type="reset" class="btn btn-outline-secondary">Borrar</button>
            </form>
        </section>
    </main>

    <!-- footer: el pie de pagina, con su clase propia "pie" -->
    <footer class="pie">
        <p>Los productos y sus precios son de ejemplo.</p>
        <p>ElectroVerde · Ingeniería Web I · IU Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
